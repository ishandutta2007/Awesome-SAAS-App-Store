<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#07090e"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="cardGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1) translate(0,0)}50%{opacity:.65;transform:scale(1.15) translate(20px,-15px)}}@keyframes floatPill1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes floatPill2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(14px) rotate(-1.5deg)}}@keyframes floatPill3{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.03)}}@keyframes dashMove{0%{stroke-dashoffset:0}}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:48px;fill:#fff;letter-spacing:-1px}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.blob-1{animation:pulseGlow 8s ease-in-out infinite alternate;transform-origin:200px 100px}.blob-2{animation:pulseGlow 10s ease-in-out infinite alternate;animation-delay:-4s;transform-origin:1000px 250px}.floating-card-1{animation:floatPill1 6s ease-in-out infinite}.floating-card-2{animation:floatPill2 7s ease-in-out infinite;animation-delay:-2.5s}.floating-card-3{animation:floatPill3 5.5s ease-in-out infinite;animation-delay:-1s}.stream-line{stroke-dasharray:8,12;animation:dashMove 4s linear infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g stroke="#fff" stroke-width="1" opacity=".08"><line x1="100" x2="100" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="500" x2="500" y1="0" y2="360"/><line x1="700" x2="700" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/><line x1="1100" x2="1100" y1="0" y2="360"/><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="220" y2="220"/><line x1="0" x2="1200" y1="300" y2="300"/></g><circle cx="240" cy="90" r="130" fill="url(#primaryGrad)" class="blob-1" filter="url(#glow)"/><circle cx="980" cy="240" r="140" fill="url(#cyanGrad)" class="blob-2" filter="url(#glow)"/><g opacity=".4"><path fill="none" stroke="#6366f1" stroke-width="2.5" d="M 120 280 C 300 240, 500 320, 750 270 S 1050 290, 1150 200" class="stream-line"/><path fill="none" stroke="#06b6d4" stroke-width="2" d="M 80 100 C 260 140, 480 80, 800 130 S 1000 80, 1120 140" class="stream-line"/></g><g class="floating-card-1" transform="translate(860, 45)"><rect width="260" height="52" fill="url(#cardGrad)" stroke="#6366f1" stroke-opacity=".6" stroke-width="1.5" filter="url(#cardGlow)" rx="26"/><circle cx="28" cy="26" r="10" fill="#10b981"/><text x="48" y="31" class="badge-text">⚡ 15,000+ Apps &amp; Plugins</text></g><g class="floating-card-2" transform="translate(890, 175)"><rect width="240" height="54" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.5" filter="url(#cardGlow)" rx="14"/><circle cx="26" cy="27" r="10" fill="#8b5cf6"/><text x="46" y="32" class="badge-text">📦 Enterprise Marketplaces</text></g><g class="floating-card-3" transform="translate(70, 275)"><rect width="250" height="46" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity=".5" stroke-width="1.2" rx="23"/><circle cx="24" cy="23" r="8" fill="#f43f5e"/><text x="42" y="28" class="badge-text">🔓 Open-Source Registries</text></g><g transform="translate(100, 105)"><rect width="220" height="28" x="0" y="0" fill="#6366f1" fill-opacity=".2" stroke="#6366f1" stroke-opacity=".5" stroke-width="1" rx="14"/><text x="14" y="19" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM DIRECTORY</text><text x="0" y="72" class="title-text">Awesome <tspan fill="url(#primaryGrad)">SaaS App Store</tspan> 🚀</text><text x="0" y="112" class="subtitle-text">Marketplace Infrastructure, Plugin Registries &amp; Integration Directories</text><g><text fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="500" transform="translate(0, 138)">⭐ Commercial Leaders • 🛡️ Open-Source Registries • 📊 Market Dynamics • 💰 Verified Tier Pricing</text></g></g><rect width="1198" height="358" x="1" y="1" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity=".3" rx="15"/></svg>